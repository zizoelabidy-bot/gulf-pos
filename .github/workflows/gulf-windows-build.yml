name: GULF POS Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build

      - name: Build Windows review installer (NSIS, unsigned)
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer and hash
        shell: pwsh
        run: |
          $exe = "release/GULF-POS-Setup.exe"
          if (!(Test-Path $exe)) { Get-ChildItem release; throw "Installer not found at $exe" }
          Get-Item $exe | Select-Object Name, Length
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  GULF-POS-Setup.exe" | Set-Content release/SHA256SUMS.txt
          $hash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GULF-POS-Setup
          path: |
            release/GULF-POS-Setup.exe
            release/SHA256SUMS.txt

